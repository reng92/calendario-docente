name: Cron

on:
  schedule:
    # Lezioni: ogni 5 minuti, 6:00–13:00 UTC (≈ 7-14 ora legale IT), lun–sab
    - cron: "*/5 6-13 * * 1-6"
    # Circolari: ogni 5 minuti, 6:00–21:00 UTC (≈ 8:00–24:00 ora legale IT)
    - cron: "*/5 6-21 * * *"

jobs:
  ping-lessons:
    if: github.event.schedule == '*/5 6-13 * * 1-6'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lesson notifications
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://calendario-docente.vercel.app/api/cron/lessons

  ping-circolari:
    if: github.event.schedule == '*/5 6-21 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger circolari check
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://calendario-docente.vercel.app/api/cron/circolari
